name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Compila IWAU-ITA-Installer.exe
        shell: pwsh
        run: |
          python -m PyInstaller --onefile --windowed --name "IWAU-ITA-Installer" `
            --version-file "$env:GITHUB_WORKSPACE\version_info.txt" `
            --distpath dist --workpath build --specpath build installer_ita.py

      - name: Controllo eseguibile
        shell: pwsh
        run: |
          $exe = "dist/IWAU-ITA-Installer.exe"
          if (-not (Test-Path $exe)) { throw "exe non prodotto" }
          "{0:N2} MB" -f ((Get-Item $exe).Length / 1MB)
          (Get-Item $exe).VersionInfo | Select-Object FileDescription, CompanyName

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IWAU-ITA-Installer
          path: dist/IWAU-ITA-Installer.exe
          if-no-files-found: error

      - name: Release (solo tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/IWAU-ITA-Installer.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
